<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="project.html">
</head>

<body>

    <div class="contact-box">
        <h1>My Favourite Recipe</h1>
        <h2>Contact us</h2>

        <p>We could love to hear from you!</p>

        <div class="contact-info">
            <p>
                <b>Email:</b>
                <span class="blur" onclick="showemail()" id="email">devangidosi@gmail.com</span>
            </p>

            <p>
                <b>contact no.:</b>
                <span class="blur" onclick="showphone()" id="phone">+91 8769531089</span>
            </p>
        </div>
        
        <form action="">
            <label for="">Name</label>
            <input type="text" name="" id="" placeholder="Enter your name" required>

            <label for="">Message</label>
            <textarea name="" id="" placeholder="Enter your message" rows="5" required></textarea>

            <button type="submit">Send Message</button>
        </form>

        <a href="project.html" class="home">Back To Home</a>
    </div>
    <script>
        function showemail() {
            document.getElementById("email").classList.toggle("clear");
        }
        function showphone() {
            document.getElementById("phone").classList.toggle("clear");
        }
    </script>

</body>

</html>
